name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinetos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install PostgreSQL 18 client tools (pg_dump refuse un serveur plus recent que lui)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm run format:check

      - name: Architecture boundaries
        run: pnpm run check:architecture

      - name: Apply database migrations and RLS policies
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0000_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0001_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0002_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0004_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0005_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0006_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0007_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0008_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0009_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0010_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0011_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0012_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0013_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0014_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0015_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0016_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0017_*.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -c "
            CREATE ROLE cabinetos_app LOGIN PASSWORD 'cabinetos_app_pw' NOSUPERUSER NOBYPASSRLS;
            GRANT CONNECT ON DATABASE cabinetos_test TO cabinetos_app;
            GRANT USAGE ON SCHEMA public TO cabinetos_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO cabinetos_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cabinetos_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO cabinetos_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO cabinetos_app;
          "
          PGPASSWORD=postgres psql -h localhost -U postgres -d cabinetos_test -f db/migrations/0003_*.sql

      - name: Test
        run: pnpm run test
        env:
          DATABASE_URL: postgres://cabinetos_app:cabinetos_app_pw@localhost:5432/cabinetos_test
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cabinetos_test
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
          BETTER_AUTH_BASE_URL: http://localhost:3000

      - name: Isolation tests (bloquant, couverture >= 90% exigee)
        run: pnpm run test:isolation
        env:
          DATABASE_URL: postgres://cabinetos_app:cabinetos_app_pw@localhost:5432/cabinetos_test
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cabinetos_test
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
          BETTER_AUTH_BASE_URL: http://localhost:3000

      - name: Build
        run: pnpm run build